<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Form Input Handling</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 2em;
            background-color: #f7f7f7;
            color: #222;
        }
        h2 {
            margin-bottom: 0.5em;
        }
        fieldset {
            border: 1px solid #bbb;
            padding: 1em 1.5em;
            max-width: 32em;
            background-color: #fff;
        }
        legend {
            font-weight: bold;
            padding: 0 0.4em;
        }
        .field {
            margin-bottom: 0.8em;
        }
        .field label {
            display: inline-block;
            width: 11em;
            vertical-align: top;
            font-weight: bold;
        }
        .field input[type="text"],
        .field input[type="password"],
        .field textarea,
        .field select {
            padding: 0.2em;
            border: 1px solid #999;
            border-radius: 3px;
        }
        .field .choice {
            display: inline-block;
            margin-right: 1em;
            font-weight: normal;
            width: auto;
        }
        .field input[type="submit"],
        .field input[type="reset"] {
            padding: 0.3em 1em;
        }
    </style>
</head>
<body>
    <h2>Register</h2>
    <fieldset>
        <legend>Person Details</legend>
        <form name="myform" action="processData.php" method="POST">
            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" name="surname" id="surname" size="31" />
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="text" name="email" id="email" size="31" />
            </div>
            <div class="field">
                <label for="passwd">Password</label>
                <input type="password" name="passwd" id="passwd" size="31" />
            </div>
            <div class="field">
                <label for="address">Street Address</label>
                <textarea name="address" id="address" rows="3" cols="22"></textarea>
            </div>
            <div class="field">
                <label for="state">State</label>
                <select name="state" id="state">
                    <option value="-1" selected>choose your state</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2">Queensland</option>
                    <option value="3">Victoria</option>
                    <option value="4">New South Wales</option>
                    <option value="5">Tasmania</option>
                    <option value="6">South Australia</option>
                    <option value="7">Western Australia</option>
                    <option value="8">Northern Territory</option>
                </select>
            </div>
            <div class="field">
                <input type="hidden" name="country" value="Australia" />
            </div>
            <div class="field">
                <span>Gender</span>
                <label class="choice" for="sex_male">
                    <input type="radio" name="sex" id="sex_male" value="male" /> Male
                </label>
                <label class="choice" for="sex_female">
                    <input type="radio" name="sex" id="sex_female" value="female" /> Female
                </label>
            </div>
            <div class="field">
                <label class="choice" for="vegetarian">
                    <input type="checkbox" name="vegetarian" id="vegetarian" /> Vegetarian?
                </label>
            </div>
            <div class="field">
                <label for="submit">&nbsp;</label>
                <input type="submit" name="submit" id="submit" value="Submit" />
                <input type="reset" name="reset" id="reset" value="Reset" />
            </div>
        </form>
    </fieldset>
</body>
</html>
