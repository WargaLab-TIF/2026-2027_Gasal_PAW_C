<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Person Details</title>
</head>
<body>
    <h1>Register</h1>

    <form name="myForm" action="processData.php" method="POST">
    <!-- <form name="myForm" action="processData.php" method="GET"> -->
        <fieldset>
            <legend>Person Details</legend>

            <div class="field">
                <label for="surname">Surname :</label>
                <input type="text" id="surname" name="surname" maxlength="31">
            </div>
            <br>
            <div class="field">
                <label for="email">Email address :</label>
                <input type="email" id="email" name="email" maxlength="150">
            </div>
            <br>
            <div class="field">
                <label for="passwd">Password :</label>
                <input type="password" id="passwd" name="passwd" maxlength="31">
            </div>
            <br>
            <div class="field">
                <label for="address">Street Address :</label><br>
                <textarea id="address" name="address" rows="3" cols="22"></textarea>
            </div>
            <br>
            <div class="field">
                <label for="state">State :</label>
                <select id="state" name="state">
                    <option value="-1" selected>Choose your state</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2">Queensland</option>
                    <option value="3">Victoria</option>
                    <option value="4">New South Wales</option>
                    <option value="5">Tasmania</option>
                    <option value="6">South Australia</option>
                    <option value="7">Western Australia</option>
                    <option value="8">Northern Territory</option>
                </select>
            </div>
            <br>
            <input type="hidden" name="country" value="Australia">

            <div class="field">
                <label>Gender :</label>
                <div class="choices">
                    <label><input type="radio" name="sex" value="male"> Male</label>
                    <label><input type="radio" name="sex" value="female"> Female</label>
                </div>
            </div>
            <br>
            <div class="field">
                <label for="vegetarian">Vegetarian? :</label>
                <div><input type="checkbox" id="vegetarian" name="vegetarian"></div>
            </div>
            <br>
            <div class="actions">
                <input type="submit" value="Submit" name="submit">
                <input type="reset" value="Reset" name="reset">
            </div>
        </fieldset>
    </form>
</body>
</html>
